{% extends 'base.html' %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <input type="text" class="form-control" id="title" name="title" value="{{ qualityeducation_instance.title }}">
          </div>
          <div class="form-group">
            <div id="editor" style="height: 200px;">{{ qualityeducation_instance.description | safe }}</div>
            <input type="hidden" id="description" name="description" value="{{ qualityeducation_instance.description }}">
          </div>
          <br>
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

<script>
    var quill = new Quill('#editor', {
      theme: 'snow'
    });
  
    // Update hidden input field with HTML content on form submission
    document.querySelector('form').addEventListener('submit', function() {
      var descriptionInput = document.querySelector('#description');
      descriptionInput.value = quill.root.innerHTML;
    });
</script>

{% endblock content %}
