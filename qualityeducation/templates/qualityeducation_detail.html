{% extends 'base.html' %}

{% block content %}
<div class = "card">
    <div class="card-body">
        <h1>{{ qualityeducation_instance.title }}</h1>
        <br>
        <p>{{ sanitized_description | safe }}</p>
    </div>
</div>

<div class = "btn" style="position: fixed; bottom: 70px; right: 20px;">
    <a class = "btn btn-danger" role = "button" href="{% url 'qualityeducation_delete' pk=qualityeducation_instance.pk %}">Delete</a>
</div>

<div class = "btn" style="position: fixed; bottom: 20px; right: 20px;">

    <a class = "btn btn-primary" role = "button" href="{% url 'qualityeducation_edit' pk=qualityeducation_instance.pk %}">Edit</a>
</div>
